# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: "en-US"
early_access: false
tone_instructions: "Extremely adversarial, pedantic, and uncompromising Principal Security Auditor. Scrutinize every line of code for bypasses, edge cases, subtle vulnerabilities, and architectural invariants."

reviews:
  profile: "assertive"
  request_changes_workflow: true
  fail_commit_status: true
  review_status: true
  review_details: true
  review_progress: true
  collapse_walkthrough: false
  high_level_summary: true
  high_level_summary_in_walkthrough: true
  changed_files_summary: true
  sequence_diagrams: true
  estimate_code_review_effort: true
  assess_linked_issues: true
  related_issues: true
  related_prs: true
  poem: false
  disable_cache: true
  auto_review:
    enabled: true
    drafts: true
    base_branches:
      - ".*"

  tools:
    clippy:
      enabled: true
    semgrep:
      enabled: true
    ast-grep:
      enabled: true
    trivy:
      enabled: true
    gitleaks:
      enabled: true
    trufflehog:
      enabled: true
    osvScanner:
      enabled: true
    shellcheck:
      enabled: true
    markdownlint:
      enabled: true
    yamllint:
      enabled: true

  pre_merge_checks:
    docstrings:
      threshold: 80
    custom_checks:
      - name: "Non-Custodial Invariant & Key Separation"
        mode: "error"
        instructions: |
          Verify that SatsPath NEVER handles, requests, stores, or generates private spending keys
          (BIP-39 seeds, xprv/tprv, or node credentials). SatsPath holds only the non-custodial
          secp256k1 identity keypair used for metadata profiles and rotations. The host wallet
          must retain final authority for inspecting, signing, and executing payments.
      - name: "Daemon Authentication & Privilege Enforcement"
        mode: "error"
        instructions: |
          Verify that every daemon endpoint performing sensitive state changes, identity binding,
          profile updates, or wallet operations (such as /v1/claim, /v1/invites, /v1/send)
          strictly requires authorization (admin Bearer token/macaroon) unless an authentic,
          cryptographically signed profile is provided by the client. Reject unauthenticated access.
      - name: "Anti-CSRF and DNS Rebinding Defenses"
        mode: "error"
        instructions: |
          Verify that satspathd enforces Content-Type: application/json on all JSON-mutating POST/PUT
          requests to prevent simple cross-origin POSTs. Verify that services bound to loopback
          strictly validate the HTTP Host header against localhost/loopback addresses to block DNS rebinding.
      - name: "Reverse Proxy Rate Limiting Integrity"
        mode: "error"
        instructions: |
          Verify that IP extraction for rate limiting adheres to the configured trusted proxy chain.
          When proxy headers are trusted, the client address must be determined by inspecting trusted
          proxy hops rather than blindly trusting spoofable client-supplied headers (leftmost XFF).
          When no trusted proxy path is configured or headers are invalid, the socket peer address
          must be used as the authoritative client IP.
      - name: "Swap Fail-Closed & Cryptographic Safety"
        mode: "error"
        instructions: |
          Verify that submarine, reverse, and cross-chain swaps fail closed. Ensure that no swap
          claims or refunds proceed if taproot or witness spending is unsupported or unverified.
          Failed swaps must never be marked as completed or refunded without verifiable on-chain evidence.
      - name: "SSRF Prevention & IP Pinning"
        mode: "error"
        instructions: |
          Verify that outbound network requests (HTTP, Nostr, DNS resolvers) defensively filter
          private, loopback, link-local, and reserved IP ranges. Verify that resolved IPs are
          pinned to the actual socket connection to prevent TOCTOU DNS rebinding attacks.
      - name: "BIP-353 DNSSEC & Authentic Proofs"
        mode: "error"
        instructions: |
          Verify that BIP-353 resolvers perform local DNSSEC validation and fail closed if signatures
          are invalid or missing. Ensure the system never fabricates artificial signatures or presents
          DNS data as an identity-authenticated SatsPath Schnorr signature.
      - name: "Identity Key Continuity & Revocation"
        mode: "error"
        instructions: |
          Verify that profile updates enforce key continuity (TOFU) and monotonic sequence numbers,
          rejecting unauthorized key replacements. Verify that revoked profiles immediately halt
          resolution and routing without falling back to stale profiles.
      - name: "Transparency Log & Witness Quorum Integrity"
        mode: "error"
        instructions: |
          Verify append-only Merkle log compliance (RFC 6962), sparse Merkle state map (SMT)
          non-inclusion proof validity, and K-of-N Schnorr witness quorum verification. Check that
          equivocation, split-view, or rollback conditions trigger immediate local verification failures.
      - name: "Multi-Source Fee Consensus Robustness"
        mode: "error"
        instructions: |
          Verify concurrent multi-source fee queries (Bitcoin Core RPC, Esplora, Mempool.space)
          properly calculate median filters, isolate failing or malicious sources, and safely
          fall back to decaying caches without accepting anomalous single-source fee spikes.
      - name: "Multi-Rail Wallet Handoff & Protocol Safety"
        mode: "error"
        instructions: |
          Verify that wallet handoff payloads (BIP-21, BOLT11, BOLT12, Ark, Silent Payments)
          strictly validate addresses, network prefixes (mainnet vs testnet/regtest), and amounts.
          Ensure experimental rails fail closed if inputs or decoding are malformed.

  path_instructions:
    - path: "crates/satspath-core/**"
      instructions: |
        Audit core cryptographic primitives and state structures:
        1. Schnorr signature verification (BIP-340) and canonical JSON serialization (RFC 8785).
        2. Identity key rotation continuity (AuthorizationV1 and AcceptanceV1) and authorization checks.
        3. Replay attack resistance, monotonic sequence numbering, and timestamp boundaries.
        4. Append-only RFC 6962 Merkle log and Sparse Merkle state map (SMT) non-inclusion proofs.
    - path: "crates/satspath-core/src/resolvers/**"
      instructions: |
        Scrutinize all resolvers (HTTP, Nostr, BIP-353, Pear):
        1. SSRF prevention and IP connection pinning.
        2. Strict DNSSEC validation without blind trust in upstream AD bits.
        3. Immediate halt on revoked profiles; do not allow fallback to outdated profiles.
        4. Nostr NIP-05 and kind 30078 event validation: verify SatsPath profile signature independently of relay signatures.
    - path: "crates/satspath-router/**"
      instructions: |
        Scrutinize routing and fee logic:
        1. Multi-source fee consensus: median filtering across Bitcoin Core, Esplora, and Mempool.space; decaying cache fallback.
        2. BOLT12 TLV parsing, offer handling, and blinded-path primitives.
        3. BIP-352 Silent Payments address/output derivation safety.
        4. Ark payment pointer parsing and route scoring.
        5. Wallet handoff payload formatting (BIP-21 URIs, BOLT11 invoices) with network prefix validation.
    - path: "crates/satspath-cli/**"
      instructions: |
        Audit CLI client implementation:
        1. Sensitive credential masking in logs, terminal outputs, and error displays.
        2. Secure random generation for secp256k1 keys and memory zeroization.
        3. Input sanitization for user-supplied identifiers, amounts, and URLs.
    - path: "crates/satspathd/**"
      instructions: |
        Scrutinize satspathd daemon:
        1. Any unauthenticated route that mutates internal state, performs identity binding, or leaks invite tokens (/v1/claim, /v1/invites).
        2. Content-Type (application/json) and Host header validation to prevent CSRF and DNS rebinding.
        3. Rate limiter IP spoofing and unbounded memory growth; enforce trusted proxy chain inspection or fallback to peer socket address.
        4. Proper error handling, avoiding unwraps and panics.
    - path: "crates/satspath-witness/**"
      instructions: |
        Scrutinize witness node:
        1. K-of-N Schnorr checkpoint cosigning and consistency verification.
        2. Local rollback, fork, and equivocation detection.
        3. Strict refusal to cosign non-monotonic or conflicting state roots.
    - path: "crates/satspath-swaps/**"
      instructions: |
        Scrutinize swap execution gates and transaction builders:
        1. Must fail closed if transaction spending/broadcasting primitives are missing.
        2. Ensure strict witness script verification for HTLCs (Taproot/SegWit).
        3. Check for race conditions between refund timelocks and claim timeouts.
        4. AES-256-GCM encrypted state storage and safe key handling.
    - path: "crates/satspath-wasm/**"
      instructions: |
        Audit WebAssembly bindings:
        1. Memory safety, pointer validation, and boundary serialization across JS/WASM.
        2. Ensure panic-free operation and graceful error propagation.
        3. Never expose raw spending keys or sensitive internal state to the host JS environment.
    - path: "crates/satspath-pqc/**"
      instructions: |
        Audit post-quantum cryptography research module:
        1. Hybrid classical + ML-DSA-65 signature schemes.
        2. Constant-time operations and cryptographic boundary isolation.
        3. Ensure research primitives are never used in production safety-critical claims.
    - path: "sdk/satspath-p2p/**"
      instructions: |
        Audit Hyperswarm P2P profile transport:
        1. DHT topic isolation and peer discovery validation.
        2. Message size limits and rate limiting to prevent peer flooding or DoS.
        3. Cryptographic signature verification of resolved profiles before acceptance.
    - path: "Dockerfile*"
      instructions: |
        Audit container builds:
        1. Debian package version checks using dpkg-query for openssl and libssl3 (>= 3.0.22).
        2. Unpinned package versions, root execution risks, and layer cache invalidation.

chat:
  auto_reply: true

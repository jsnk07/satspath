[package]
name = "satspath-core"
version = "0.1.0"
edition = "2021"
# key_pins uses std::fs::File::lock, stable since Rust 1.89.
rust-version = "1.89"
description = "Core types, cryptography, codec, and registry for SatsPath"

[lib]
crate-type = ["rlib", "cdylib"]

[features]
default = ["std"]
test-utils = []
std = [
    "tokio",
    "reqwest",
    "tokio-tungstenite",
    "futures-util",
    "async-trait",
    "rand",
    "url",
    "hickory-resolver",
    "rusqlite",
]
wasm = [
    "web-sys/Request",
    "web-sys/Response",
    "web-sys/Headers",
    "web-sys/Window",
    "web-sys/RequestInit",
    "web-sys/RequestMode",
]

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
secp256k1 = { workspace = true, features = ["global-context"] }
sha2 = { workspace = true }
hex = { workspace = true }
base64 = { workspace = true }
bitcoin = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
canonical_json = "0.5"
bech32 = "0.9"
hmac = "0.12"
satspath-pqc = { path = "../satspath-pqc" }
hickory-resolver = { workspace = true, optional = true }

# Optional dependencies (enabled by default/std feature)
tokio = { workspace = true, optional = true }
reqwest = { workspace = true, optional = true }
tokio-tungstenite = { workspace = true, optional = true }
futures-util = { workspace = true, optional = true }
async-trait = { version = "0.1", optional = true }
rand = { workspace = true, optional = true }
url = { workspace = true, optional = true }
rusqlite = { workspace = true, optional = true }

# WASM-only dependencies
getrandom = { version = "0.2", features = ["js"], optional = true }
web-sys = { version = "0.3", features = ["Request", "Response", "Headers", "Window", "RequestInit", "RequestMode"], optional = true }
idna = "1.1.0"

[dev-dependencies]
tempfile = "3"
tokio = { workspace = true }
mockito = "1"
criterion = "0.8.2"
proptest = "1.5"
async-trait = "0.1"
satspath-core = { path = ".", features = ["test-utils"] }

[[bench]]
name = "core_benches"
harness = false
